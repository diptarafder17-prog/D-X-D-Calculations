/* =========================================================
   ROOT
========================================================= */

:root{
    --bg:#050810;
    --bg2:#080d18;

    --card:rgba(12,19,32,.78);
    --card2:rgba(16,25,42,.9);

    --line:rgba(255,255,255,.08);
    --line2:rgba(56,189,248,.22);

    --text:#f8fafc;
    --muted:#94a3b8;
    --muted2:#64748b;

    --cyan:#22d3ee;
    --blue:#3b82f6;
    --purple:#8b5cf6;
    --green:#22c55e;
    --yellow:#facc15;
    --red:#ef4444;

    --radius:20px;
    --max:1180px;

    --shadow:
        0 25px 80px rgba(0,0,0,.35);
}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    color:var(--text);

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:

        radial-gradient(
            900px 500px at 0% -10%,
            rgba(34,211,238,.14),
            transparent 70%
        ),

        radial-gradient(
            800px 500px at 100% 10%,
            rgba(139,92,246,.13),
            transparent 70%
        ),

        radial-gradient(
            800px 500px at 50% 100%,
            rgba(59,130,246,.08),
            transparent 70%
        ),

        var(--bg);

    line-height:1.6;

    overflow-x:hidden;
}

a{
    color:inherit;
}

button{
    font:inherit;
}

::selection{
    background:rgba(34,211,238,.25);
}


/* =========================================================
   BACKGROUND GRID
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    z-index:-1;

    pointer-events:none;

    opacity:.17;

    background-image:

        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:45px 45px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );
}


/* =========================================================
   CONTAINER
========================================================= */

.container{

    width:
        min(
            calc(100% - 32px),
            var(--max)
        );

    margin:auto;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:sticky;

    top:0;

    z-index:1000;

    border-bottom:
        1px solid var(--line);

    background:
        rgba(5,8,16,.72);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);
}

.header-inner{

    min-height:68px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}


/* =========================================================
   BRAND
========================================================= */

.brand{

    display:flex;

    align-items:center;

    gap:11px;

    text-decoration:none;

    font-weight:850;

    white-space:nowrap;
}

.brand img{

    width:40px;

    height:40px;

    object-fit:cover;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow:
        0 0 28px
        rgba(34,211,238,.18);
}

.brand-name{

    font-size:15px;
}

.brand-sub{

    display:block;

    color:var(--muted2);

    font-size:10px;

    font-weight:600;

    letter-spacing:.5px;
}

   NAV
========================================================= */

    align-items:center;

    gap:4px;
}
